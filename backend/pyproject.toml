[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-api"
version = "0.1.0"
description = "SAFE - API per la gestione degli incidenti su piste da sci"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "django-filter>=25.1",
  "drf-spectacular>=0.28",
  "django-environ>=0.12",
  "django-cors-headers>=4.7",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.5",
  "redis>=5.2",
  "channels>=4.2",
  "channels-redis>=4.2",
  "daphne>=4.2",
  "PyJWT[crypto]>=2.10",
  "requests>=2.32",
  "gunicorn>=23",
  "uvicorn[standard]>=0.34",
  "pynacl>=1.5",
  "openpyxl>=3.1",
  "boto3>=1.35",
  "uuid-utils>=0.10",
  "weasyprint>=63",
  "xlwt>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6",
  "pytest-xdist>=3.6",
  "factory-boy>=3.3",
  "faker>=33",
  "responses>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs>=3.15",
  "types-requests",
]

[tool.setuptools.packages.find]
include = ["safe*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "safe.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --ds=safe.settings.test"
markers = [
  "authz: test della matrice permessi",
  "tenant: test di isolamento multi-tenant",
  "benchmark: test di prestazioni (nightly)",
]

[tool.coverage.run]
source = ["safe"]
omit = ["safe/settings/*", "safe/asgi.py", "safe/wsgi.py", "*/migrations/*"]

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "T20", "N", "SIM"]
ignore = ["S101", "S105", "S106", "DJ008"]  # assert nei test; password di sviluppo; __str__ sulle tabelle ponte

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DJ"]
"safe/apps/tenancy/rls.py" = ["S608"]  # SQL DDL costruito da costanti interne

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "safe.settings.test"
