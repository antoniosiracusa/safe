        kind: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        progress: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        download_url: { type: [string, "null"] }
        result_filename: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        user: { $ref: "#/components/schemas/Ref" }
        platform: { type: string, enum: [ios, android] }
        os_version: { type: string }
        app_version: { type: string }
        status: { type: string, enum: [pending, authorized, revoked] }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
    CompanyKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        algorithm: { type: string }
        public_key: { type: string, format: byte }
        created_at: { type: string, format: date-time }
    UserKey:
      type: object
      required: [public_key, private_key_encrypted, kdf_params]
      properties:
        algorithm: { type: string, default: x25519-v1 }
        public_key: { type: string, format: byte }
        private_key_encrypted: { type: string, format: byte }
        kdf_params: { type: object }
        created_at: { type: string, format: date-time }

x-websocket:
  url: wss://api.safe.example/ws/v1/realtime/
  auth: primo messaggio {"type":"auth","token":"<JWT>"} entro 5 s, altrimenti chiusura 4401
  messages:
    server_to_client:
      - { type: job.completed, payload: { job_id: uuid, kind: string, status: string } }
      - { type: event.created, payload: { event_id: uuid, dateandtime: date-time } }
      - { type: vehicle.position, payload: { device_id: uuid, lon: number, lat: number, ts: date-time }, note: futuro }
    client_to_server:
      - { type: auth, payload: { token: string } }
      - { type: subscribe, payload: { topics: [jobs, events, vehicles] } }
