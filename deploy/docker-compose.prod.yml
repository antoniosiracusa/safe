# SAFE · produzione (docs/08-messa-online.md, runbook-produzione.md)
#
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# Un solo host pubblico (${DOMAIN}) servito da Traefik con certificati Let's Encrypt:
#   https://${DOMAIN}/            SPA (nginx)
#   https://${DOMAIN}/api/...     API Django (gunicorn)
#   https://${DOMAIN}/ws/...      WebSocket (daphne)
#   https://auth.${DOMAIN}/       Keycloak
# Nessun'altra porta è esposta. Le immagini arrivano dal registro (CI), non si compila sul server.

name: safe

x-api-base: &api-base
  image: ${API_IMAGE:-ghcr.io/antoniosiracusa/safe-api:latest}
  env_file: .env
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"  # Docker Engine recenti rifiutano il client 1.24 predefinito del provider
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.headers.names.Authorization=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [internal]
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/antoniosiracusa/safe-web:latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./generated/app-config.json:/usr/share/nginx/html/config/app-config.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.middlewares=security@file
      - traefik.http.services.web.loadbalancer.server.port=80
      # www.DOMINIO → DOMINIO (301)
      - traefik.http.routers.www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.www.entrypoints=websecure
      - traefik.http.routers.www.middlewares=www-redirect
      - traefik.http.routers.www.service=web
      - traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.www-redirect.redirectregex.permanent=true
    networks: [internal]
    logging: *logging

  api:
    <<: *api-base
    command: ["gunicorn", "safe.wsgi:application", "-b", "0.0.0.0:8000", "-w", "3", "--timeout", "120", "--access-logfile", "-"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.middlewares=security@file
      - traefik.http.services.api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  ws:
    <<: *api-base
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "safe.asgi:application"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/ws`)
      - traefik.http.routers.ws.entrypoints=websecure
      - traefik.http.services.ws.loadbalancer.server.port=8001

  worker:
    <<: *api-base
    command: ["celery", "-A", "safe", "worker", "-l", "INFO", "-Q", "default,exports,pdf", "--concurrency", "2"]

  beat:
    <<: *api-base
    command: ["celery", "-A", "safe", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SAFE_DB_PASSWORD: ${SAFE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB", "-c", "max_connections=100"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.prod.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]
    logging: *logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ./generated/realm-safe.json:/opt/keycloak/data/import/realm-safe.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.services.auth.loadbalancer.server.port=8080
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  # Storage S3 per PDF ed export. Sostituibile con Aruba Object Storage cambiando S3_* in .env e
  # rimuovendo questo servizio (runbook-produzione.md).
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks: [internal]
    logging: *logging

networks:
  internal:

volumes:
  db-data:
  minio-data:
  traefik-letsencrypt:
