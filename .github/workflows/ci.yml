name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: safe.settings.test
      SECRET_KEY: ci
      DATABASE_URL: postgis://safe_owner:safe@localhost:5432/safe
      REDIS_URL: redis://localhost:6379/0
      OIDC_ISSUER: http://localhost:8080/realms/safe
      OIDC_AUDIENCE: safe-api
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System deps (GDAL/GEOS for GeoDjango, psql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev postgresql-client
      - name: Database roles (same as infra/db/init.sql)
        env: { PGPASSWORD: postgres }
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f ../infra/db/init.sql
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy safe
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --progress-spinner off || echo '::warning::pip-audit ha segnalato vulnerabilità'
      - name: Test
        run: pytest --cov=safe --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high || echo '::warning::npm audit ha segnalato vulnerabilità'
      - run: npm run lint --if-present
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build -- --configuration=production

  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "release=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; fi
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/safe-api:${{ steps.tags.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/safe-api:latest
            ${{ steps.tags.outputs.release && format('ghcr.io/{0}/safe-api:{1}', github.repository_owner, steps.tags.outputs.release) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/safe-web:${{ steps.tags.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/safe-web:latest
            ${{ steps.tags.outputs.release && format('ghcr.io/{0}/safe-web:{1}', github.repository_owner, steps.tags.outputs.release) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
